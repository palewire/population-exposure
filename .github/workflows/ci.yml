name: Continuous integration

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.10.7"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python dependencies
        run: make install-dev

      - name: Run static checks
        run: make check

      - name: Prune uv cache
        run: uv cache prune --ci

  test-python:
    name: Test Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.10.7"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python
        run: uv python install ${{ matrix.python }}

      - name: Install Python dependencies
        run: make install-test UV_PYTHON=${{ matrix.python }}

      - name: Run tests
        run: make test UV_PYTHON=${{ matrix.python }}

      - name: Verify installed wheel
        if: matrix.python == '3.13'
        run: make package-check UV_PYTHON=${{ matrix.python }}

      - name: Prune uv cache
        run: uv cache prune --ci

  test-minimum-dependencies:
    name: Test minimum dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.10.7"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install Python
        run: uv python install 3.11

      - name: Test minimum dependencies
        run: make minimum-dependency-check UV_PYTHON=3.11

      - name: Prune uv cache
        run: uv cache prune --ci

  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: [check, test-python, test-minimum-dependencies]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.10.7"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Build distributions
        run: make build

      - name: Save distributions
        uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: ./dist
          if-no-files-found: error
